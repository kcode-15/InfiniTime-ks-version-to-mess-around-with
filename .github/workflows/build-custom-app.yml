name: Build Custom PineTime App
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Enter the exact Name of your app (e.g., Bored)'
        required: true
        default: 'Bored'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies and ARM Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi

      - name: Inject Custom Code into InfiniTime Files
        run: |
          chmod +x ./add_app.sh
          ./add_app.sh "${{ github.event.inputs.app_name }}"

      - name: Configure CMake Build with Toolchain Flags
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_PATH=./gcc-arm-none-eabi.cmake \
            -DARM_NONE_EABI_TOOLCHAIN_PATH=/usr

      - name: Build Firmware Packages
        run: cmake --build build --target pinetime-app -j$(nproc)

      - name: Upload Finished Zip Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineTime-${{ github.event.inputs.app_name }}-Firmware
          path: build/bin/*.zip
