name: Build Custom PineTime App (Instant Speed)
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Enter the exact Name of your app (e.g., Bored)'
        required: true
        default: 'Bored'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Uses Ubuntu's internal, lightning-fast cross-compiler image packages directly
      - name: Install System Dependencies and Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi nodejs npm ccache

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-lib-cache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-lib-cache-

      - name: Install Font Converter
        run: |
          sudo npm install -g lv_font_conv

      - name: Download Full NRF52 SDK
        run: |
          git clone --depth 1 https://github.com/KunYi/nRF5_SDK_v15.git nrf_sdk

      - name: Inject Custom Code into InfiniTime Files
        run: |
          git reset --hard HEAD
          chmod +x ./add_app.sh
          ./add_app.sh "${{ github.event.inputs.app_name }}"

      - name: Configure CMake Build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_PATH=./gcc-arm-none-eabi.cmake \
            -DARM_NONE_EABI_TOOLCHAIN_PATH=/usr \
            -DNRF5_SDK_PATH=${{ github.workspace }}/nrf_sdk \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Firmware Packages
        run: cmake --build build --target pinetime-app -j$(nproc)

      - name: Upload Finished Zip Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineTime-${{ github.event.inputs.app_name }}-Firmware
          path: build/bin/*.zip
